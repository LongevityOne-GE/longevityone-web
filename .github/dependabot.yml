# Dependabot keeps dependencies patched automatically - essential for a
# long-lived production site. It opens PRs for outdated/vulnerable packages.
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Application dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Group low-risk updates into a single PR to reduce review noise.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The separate AI Studio applet has its own lockfile.
  - package-ecosystem: "npm"
    directory: "/ai-studio"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ai-studio"

  # GitHub Actions workflow dependencies (if/when workflows are added).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
